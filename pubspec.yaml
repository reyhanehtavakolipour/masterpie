  build_runner: ^2.3.3
  flutter_lints: ^2.0.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  json_serializable: ^6.6.1
  mocktail: ^0.3.0
  flutter_launcher_icons: ^0.13.0


flutter:
