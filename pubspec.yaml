name: masterpie
description: "A new Flutter project."


publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  flutter_stripe: ^10.0.0
  bloc: ^8.0.3
  cupertino_icons: ^1.0.2
  dartz: ^0.10.1
  dio: ^4.0.6
  equatable: ^2.0.5
  flutter_bloc: ^8.1.1
  freezed: ^2.1.0+1
  freezed_annotation: ^2.2.0
  get_it: ^7.2.0
  json_annotation: ^4.8.0
  shared_preferences: ^2.0.15
  sqflite: ^2.2.5
  hive_flutter: ^1.1.0
  getwidget: ^3.1.1
  openfoodfacts: ^2.5.0
  percent_indicator: ^4.0.1
  intl: ^0.18.1
  http: ^1.1.0
  dart_openai: ^5.0.0
  envied: ^0.3.0
  google_sign_in: ^6.1.6
  supabase_flutter: ^1.10.3
  path_provider: ^2.0.2


dev_dependencies:
  build_runner: ^2.3.3
  flutter_lints: ^2.0.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  json_serializable: ^6.6.1
  mocktail: ^0.3.0



flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-Regular.ttf
        - asset: fonts/Montserrat-Bold.ttf


