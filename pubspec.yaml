  freezed: ^2.1.0+1
  freezed_annotation: ^2.2.0
  get_it: ^7.2.0
  json_annotation: ^4.8.0
  shared_preferences: ^2.0.15
  sqflite: ^2.3.3+1
  hive_flutter: ^1.1.0
  getwidget: ^3.1.1
  openfoodfacts: ^2.5.0
  percent_indicator: ^4.2.3
  intl: ^0.18.1
  http: ^1.1.0
  dart_openai: ^5.0.0
  envied: ^0.3.0
